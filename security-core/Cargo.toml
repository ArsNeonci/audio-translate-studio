[package]
name = "audio-security-core"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_Threading"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"

[features]
# Dev/test only: lets clients fall back to the CLI/in-process path when the service pipe is
# absent. Release builds omit it, so no environment variable can re-enable fallback.
default = ["dev_fallback"]
dev_fallback = []

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
