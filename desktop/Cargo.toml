[package]
name = "audio-translate-shell"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "AudioTranslate"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
getrandom = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
